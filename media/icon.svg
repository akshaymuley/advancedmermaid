<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    Source for media/icon.png (regenerate with `npm run make:icon`).

    Two stacks side by side: left muted with two nodes, right accented with three. The mark has
    to survive 32px in a Marketplace list, so it carries only one idea — a grey column against a
    pink column with an extra block — and everything is oversized to match. Anything finer (a
    divider rule, arrowheads, a fourth node) turned to mush at that size.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f3444" />
      <stop offset="100%" stop-color="#1a1d25" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#bg)" />

  <!-- Left: the old version. -->
  <g stroke="#9aa2b8" stroke-width="6" stroke-linecap="round">
    <rect x="16" y="26" width="40" height="30" rx="8" fill="#454b5e" />
    <path d="M36 56 L36 72" />
    <rect x="16" y="72" width="40" height="30" rx="8" fill="#454b5e" />
  </g>

  <!-- Right: the new version — one extra block, and the accent that carries the difference. -->
  <g stroke="#ff4d8d" stroke-width="6" stroke-linecap="round">
    <rect x="72" y="14" width="40" height="26" rx="8" fill="#5c2340" />
    <path d="M92 40 L92 51" />
    <rect x="72" y="51" width="40" height="26" rx="8" fill="#ff4d8d" />
    <path d="M92 77 L92 88" />
    <rect x="72" y="88" width="40" height="26" rx="8" fill="#5c2340" />
  </g>
</svg>
