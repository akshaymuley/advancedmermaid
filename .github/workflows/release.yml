name: Release

# Tag-triggered. Always builds the .vsix and attaches it to a GitHub Release; only publishes to
# the Marketplace once a VSCE_PAT secret exists, so tagging before then is safe.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Package
        run: npx @vscode/vsce package --out "advanced-mermaid-${GITHUB_REF_NAME#v}.vsix"

      - name: Create GitHub Release
        # v3 is the node24 runtime major, matching the pins in ci.yml — v2 declares node20, which
        # the runner force-runs on 24 and annotates. v3 changes nothing else: same inputs.
        uses: softprops/action-gh-release@v3
        with:
          files: '*.vsix'
          generate_release_notes: true

      - name: Publish to the VS Code Marketplace
        # Skipped until the secret is added — see RELEASING.md.
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        # Same conditional-secret pattern: dormant until OVSX_PAT exists. Publishes the .vsix
        # built above rather than re-packaging, so both registries get a byte-identical artifact.
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        run: npx ovsx publish "advanced-mermaid-${GITHUB_REF_NAME#v}.vsix" -p "$OVSX_PAT"
