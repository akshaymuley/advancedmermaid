name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vite 8 (pulled in by vitest) requires ^20.19 || >=22.12; 22 also keeps the
          # runner's npm close enough to the one that writes the lockfile locally.
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Runs the extension in a real VS Code: activation, command registration, the webview
  # handshake, and the built-in git API. Separate job because it downloads VS Code and needs a
  # display; a failure here means something the unit tests structurally cannot see.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The suite reads samples/pipeline.mmd at HEAD through the git extension, so it needs
          # real history rather than the default shallow clone.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: xvfb-run -a npm run test:integration
