name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned at v5, the first major of each that declares the node24 runtime — v4
# declares node20, which the runner now force-runs on 24 and warns about. v6 and v7 exist and
# also declare node24, so they buy nothing here; crossing those majors is a separate decision
# to make on their own merits rather than a side effect of silencing a deprecation.
#
# Note `node-version` below is unrelated: it is the Node the build scripts run on, not the one
# the actions themselves execute in.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # vite 8 (pulled in by vitest) requires ^20.19 || >=22.12; 22 also keeps the
          # runner's npm close enough to the one that writes the lockfile locally.
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Runs the extension in a real VS Code: activation, command registration, the webview
  # handshake, and the built-in git API. Separate job because it downloads VS Code and needs a
  # display; a failure here means something the unit tests structurally cannot see.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The suite reads samples/pipeline.mmd at HEAD through the git extension, so it needs
          # real history rather than the default shallow clone.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: xvfb-run -a npm run test:integration

  # Drives the real webview in Chromium: whether a diagram actually ends up framed, whether the
  # panes decouple, and — since Semantic — whether mermaid accepts source this project *generated*.
  # That last one has no other witness: a merged diagram mermaid rejects leaves an empty pane and
  # no failing unit test.
  #
  # Kept out of CI until now because of the ~130 MB browser download. The cache below is what
  # changes that arithmetic: it is paid on a lockfile change rather than on every PR.
  view:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci

      # Keyed on the lockfile because that is what pins the browser build: playwright resolves a
      # specific Chromium revision per version, so a bump invalidates this exactly when it should.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # `--with-deps` runs even on a cache hit, and has to: the cache carries the browser binary,
      # not the apt packages it links against.
      - run: npx playwright install --with-deps chromium

      # No xvfb, unlike the integration job — Playwright launches Chromium headless. The script
      # builds its own bundle and already exits non-zero on a failed check.
      - run: npm run verify:view

      # A visual suite running where nobody is watching needs to hand back what it saw. "the merged
      # diagram is framed inside its pane — svg 1866x900 in pane 600x400" is a different message
      # with the screenshot beside it.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: view-screenshots
          path: dist/view-screenshots/
